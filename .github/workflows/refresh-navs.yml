name: Refresh NAVs

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours (UTC)
  workflow_dispatch: {}

concurrency:
  group: refresh-navs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh MF / NPS / International NAVs
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL and CRON_SECRET repo secrets must be set."
            exit 1
          fi
          fail=0
          for path in refresh-mf-nav refresh-nps-nav refresh-hdfc-intl-nav; do
            code=$(curl -sS -m 60 --retry 2 --retry-delay 5 \
              -o /tmp/out.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/${path}") || code="000"
            echo "== ${path} -> HTTP ${code} =="
            head -c 400 /tmp/out.json 2>/dev/null || true; echo
            if [ "${code}" != "200" ]; then
              echo "::error::${path} returned ${code}"
              fail=1
            fi
          done
          exit "${fail}"
