name: Refresh Index Levels

on:
  schedule:
    - cron: "30 3-10 * * 1-5" # Indian market hours (9am–4pm IST)
    - cron: "0 13-21 * * 1-5" # US market hours (~7pm–2:30am IST)
  workflow_dispatch: {}

concurrency:
  group: refresh-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh index levels
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL and CRON_SECRET repo secrets must be set."
            exit 1
          fi
          code=$(curl -sS -m 60 --retry 2 --retry-delay 5 \
            -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/refresh-index-levels") || code="000"
          echo "== refresh-index-levels -> HTTP ${code} =="
          head -c 400 /tmp/out.json 2>/dev/null || true; echo
          test "${code}" = "200"
